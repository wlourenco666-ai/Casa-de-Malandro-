<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Templo Escola Casa de Malandro</title>
    
    <!-- Design Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Mapeamento para o navegador entender as bibliotecas do teu App.jsx -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.2.0",
          "react-dom": "https://esm.sh/react-dom@18.2.0",
          "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
          "lucide-react": "https://esm.sh/lucide-react@0.263.1",
          "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
          "firebase/storage": "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js"
        }
      }
    </script>
    
    <!-- Tradutor de código React para o navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-slate-950 text-white min-h-screen">
    
    <div id="root">
        <!-- Ecrã de carregamento enquanto puxa o teu App.jsx -->
        <div style="display:flex; justify-content:center; align-items:center; height:100vh; flex-direction:column;">
            <div style="font-size: 3rem; margin-bottom: 1rem; animation: pulse 2s infinite;">🎩</div>
            <h2 style="font-family: sans-serif; color: #fbbf24;">A puxar o sistema do Templo...</h2>
        </div>
    </div>

    <!-- Script inteligente que vai buscar o teu App.jsx e o executa -->
    <script type="module">
      fetch('./App.jsx')
        .then(resposta => {
          if (!resposta.ok) throw new Error("Ficheiro App.jsx não encontrado");
          return resposta.text();
        })
        .then(codigoJsx => {
          // Garante que a função de desenhar a interface está presente
          if (!codigoJsx.includes('createRoot')) {
            codigoJsx += `\n\nimport { createRoot } from 'react-dom/client';\nconst root = createRoot(document.getElementById('root'));\nroot.render(<App />);`;
          }
          
          // Traduz o código
          const codigoJs = Babel.transform(codigoJsx, { presets: ['react'] }).code;
          
          // Injeta e arranca com o teu aplicativo verdadeiro
          const script = document.createElement('script');
          script.type = 'module';
          script.innerHTML = codigoJs;
          document.body.appendChild(script);
        })
        .catch(erro => {
          document.getElementById('root').innerHTML = '<h2 style="color:red; text-align:center; padding:20px;">Erro: Não foi possível carregar o App.jsx.</h2>';
          console.error(erro);
        });
    </script>
  </body>
</html>
